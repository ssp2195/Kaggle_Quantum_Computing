name: benchmark1-original-exact-cut-native-cooptimization
# Correct original shared coefficient monkeypatch in new-cut candidate
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-alt-cuts-native.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Install native KickMix exact pinned version
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Exact 3.145M math plus full physical phase word and native coherent results
        run: |
          mkdir -p runs
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_alt_cuts_native --max 4 --samples 256 | tee runs/alt-cuts-native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-alternative-p7-exact-cut-native
          path: runs/
