name: benchmark-1-coefficient-streaming
on:
  push:
    branches: [benchmark-1]
    paths: ['.github/workflows/benchmark1-streamed.yml']
  workflow_dispatch:
jobs:
  streamed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          python -m pip install /tmp/Qualtran/kickmix
      - name: Native 22-bit coherent streaming tests
        run: python -m pytest -q tests/test_priority1_streamed.py
      - name: Compile and compare two equivalent native kickmix circuit structures
        run: |
          mkdir -p out runs
          python -m src.priority1_cli build --streamed --family chebyshev \
             --degree 2 --segment-bits 7 --precision 26 \
             --drops 10,12,11 --output out/streamed.kmb | tee runs/streamed_resources.json
          python -m src.priority1_cli build --truncated --family chebyshev \
             --degree 2 --segment-bits 7 --precision 26 \
             --drops 10,12,11 --output out/joint.kmb | tee runs/joint_resources.json
          python -m src.priority1_cli verify --circuit out/streamed.kmb \
             --random-count 16384 --output runs/streamed_samples.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-coefficient-streaming
          path: |
            out/
            runs/
