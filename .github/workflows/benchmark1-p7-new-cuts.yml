name: benchmark1-original-p7-joint-exact-cut-refit
# Rerun corrected unique cuts-key reporting after eight exhaustive passes
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-p7-new-cuts.yml']
jobs:
  mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy
      - name: Exhaustive 3.145M phase accuracy for each jointly refitted exact-cut model
        run: |
          mkdir -p runs
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_p7_new_cuts_sweep --max 8 | tee runs/p7-new-cuts.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-exhaustive-p7-joint-integer-cut-refits
          path: runs/
