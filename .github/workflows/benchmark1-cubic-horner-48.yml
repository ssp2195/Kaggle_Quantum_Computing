name: benchmark1-original-cubic-48-cell-horner
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-cubic-horner-48.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Independent full 48 by 65536 exact cubic Horner polynomial phase screen
        run: |
          mkdir -p runs out
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_cubic_horner_48 | tee runs/cubic-math.json
      - name: Pin verified native KickMix release
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Native resource and 64-trajectory coherence of original cubic Horner
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_cubic_horner_48 --native --sample 256 | tee runs/cubic-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-cubic-horner-48segment-exact-and-native
          path: |
            runs/
            out/*.kmb
