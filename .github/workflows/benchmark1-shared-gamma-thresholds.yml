name: benchmark1-original-shared-high-curvature-threshold-comparator
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-shared-gamma-thresholds.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Install original pinned native KickMix compiler
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Native cost and quantum coherence for shared C5/C6 threshold without early slope erase
        run: |
          mkdir -p runs
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_late_gamma_bitplanes --late 2 3 --shared-thresholds --samples 256 | tee runs/shared-thresholds.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-shared-monotone-curvature-prefix-thresholds
          path: runs/
