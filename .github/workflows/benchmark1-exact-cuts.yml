name: benchmark-1-exhaustive-cut-selection
on:
  push:
    branches: [benchmark-1]
    paths: ['.github/workflows/benchmark1-exact-cuts.yml']
  workflow_dispatch:
jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        drops: ["10,8,15", "10,12,11", "10,11,12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          python -m pip install /tmp/Qualtran/kickmix
      - name: Exhaustive arithmetic-model tests
        run: python -m pytest -q tests/test_priority1_exact.py
      - name: Compile full 22-bit kickmix candidate and run trajectory samples
        shell: bash
        run: |
          mkdir -p out runs
          python -m src.priority1_cli build --truncated --family chebyshev \
            --degree 2 --segment-bits 7 --precision 26 \
            --drops "${{ matrix.drops }}" --output out/phase.kmb | tee runs/resources.json
          python -m src.priority1_cli verify --circuit out/phase.kmb \
            --random-count 8192 --output runs/sample_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-cut-${{ strategy.job-index }}
          path: |
            out/
            runs/
