name: benchmark-1-xag-lookup-primitive
on:
  push:
    branches: [benchmark-1]
    paths:
      - 'src/benchmark1_xag_lookup.py'
      - 'tests/test_benchmark1_xag_lookup.py'
      - '.github/workflows/benchmark1-xag-lookup.yml'
  workflow_dispatch:
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          python -m pip install /tmp/Qualtran/kickmix
      - name: Exact ANF algebra and native kickmix measurement-corrected lookup tests
        run: python -m pytest -q -s tests/test_benchmark1_xag_lookup.py
