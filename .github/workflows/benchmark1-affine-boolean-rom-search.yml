name: benchmark1-independent-clifford-affine-boolean-rom-search
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-affine-boolean-rom-search.yml']
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy
      - name: Search original reversible GF2 address bases and exhaustively prove all 512 ROM outputs
        run: |
          mkdir -p runs
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_affine_boolean_rom_search --seeds 8 --iterations 1600 | tee runs/affine-anf-search.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-affine-boolean-rom-prefix-search
          path: runs/
