name: benchmark1-original-phase-overflow-single-bit-trim
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-pad9-symmetric.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Pin original native KickMix
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Validate small known whole-turn overflow and native phase
        run: |
          mkdir -p out runs
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_phase_pad9_symmetric --samples 256 | tee runs/pad9-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-v8-high-intercept-phase-pad-trim
          path: |
            out/*.kmb
            runs/
