name: benchmark1-four-stage-normalizer-full-verified
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-binary-normalizer-full.yml']
jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Pin native compiler
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Build new mathematically exact normalization under pinned compiler
        run: |
          mkdir -p out runs mirror
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_binary_block_normalizer --output out/binary_block.kmb --verify-sample 256 > runs/native.json
          cat runs/native.json
      - name: Download original pinned independent verifier mirror
        run: |
          curl -fLsS --retry 3 https://raw.githubusercontent.com/Inzainos/quantum-circuit-compilation/3dc0c58c5aa303ec8319433aded257aa757d14db/verifiers/invsqrt/verify_submission_invsqrt.py -o mirror/verify_submission_invsqrt.py
          python - <<'PY'
          import hashlib
          b=open('mirror/verify_submission_invsqrt.py','rb').read()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest() == '1fa529e9790a5cb000ee7f084e197c9252e5f9d7'
          PY
      - name: Verify full 3,133,452 x 64 salted trajectories
        run: |
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 python -I mirror/verify_submission_invsqrt.py out/binary_block.kmb --n-p 10 --beta 1 --precision-bits 24 --eta 218 --max-x 3133452 --shots-per-x 64 --batch-size 256 --max-workers 4 --salt quantum-circuit-local-v1 > runs/full_score.json
          cat runs/full_score.json
      - name: Require PASS and lower Q*C than verified 7.627x
        run: |
          python - <<'PY'
          import json
          d=json.load(open('runs/full_score.json'))
          assert d.get('status')=='PASS', d
          assert float(d['score'])<272300.78036771005, d
          print('IMPROVED, VERIFIED QC', d['score'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independently-verified-binary-block-phase-oracle
          path: |
            runs/
            out/*.kmb
