name: benchmark1-original-single-fixed-point-phase-accumulator
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-one-phase-acc.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Install full-verifier-pinned original KickMix
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Native single-phase 30bit accumulator and sampled coherence
        run: |
          mkdir -p runs out
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_one_phase_acc | tee runs/onephase-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-one-phase-fixed-point-v9-arithmetic
          path: |
            runs/
            out/*.kmb
