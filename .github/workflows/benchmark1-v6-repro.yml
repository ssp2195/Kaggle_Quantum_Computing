name: benchmark1-v6-pinned-binary-normalizer-repro
on:
  push:
    branches: [benchmark-1]
    paths:
      - src/benchmark1_binary_block_normalizer.py
      - src/benchmark1_best_verified_v6.py
      - tests/test_benchmark1_best_v6.py
      - .github/workflows/benchmark1-v6-repro.yml
  workflow_dispatch:
jobs:
  exact-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Native compiler with exact historical pin
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Full-domain classical, native and coherent sample regression
        run: OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m pytest -q tests/test_benchmark1_best_v6.py
      - name: KMB byte-for-byte rebuild
        run: |
          mkdir -p out runs
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m src.benchmark1_best_verified_v6 --output out/verified_v6.kmb | tee runs/v6-rebuild.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-v6-reproduced-verifier-pinned-artifact
          path: |
            out/*.kmb
            runs/
