name: benchmark1-independent-coefficient-bitplane-workspace-reuse
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-coeff-bitplanes.yml']
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy
      - name: Analyze every coefficient bit for Boolean prefix complexity and exact threshold synthesis
        run: |
          mkdir -p runs
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_coefficient_bitplane_stats | tee runs/coeff-bitplanes.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-coefficient-output-reuse-feasibility
          path: runs/
