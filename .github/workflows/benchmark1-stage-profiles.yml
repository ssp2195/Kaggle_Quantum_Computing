name: benchmark1-original-native-stage-peak-qubit-profiling
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-stage-profiles.yml']
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Install native KickMix original pinned build
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Identify native high-water qubits via invalid-for-submission stage ablation
        run: |
          mkdir -p runs
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_native_stage_profiles | tee runs/native-stage-peak.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-qubit-workspace-bottleneck-profiles-non-submittable
          path: runs/
