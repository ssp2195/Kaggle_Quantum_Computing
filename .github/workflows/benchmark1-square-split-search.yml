name: benchmark1-original-symmetric-square-split-search
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-square-split-search.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Pinned original native KickMix for exact Toffoli resource accounting
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Exactly checked square identity for 8192 words per split and native quantum costs
        run: |
          mkdir -p runs
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_square_split_sweep --samples 256 | tee runs/split-sweep.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-square-split-boundary-cost-comparison
          path: runs/
