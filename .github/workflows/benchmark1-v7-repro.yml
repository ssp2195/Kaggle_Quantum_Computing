name: benchmark1-v7-sha-pinned-rom-repro
on:
  push:
    branches: [benchmark-1]
    paths:
      - src/benchmark1_pruned_anf_rom.py
      - src/benchmark1_dontcare_boolean_rom.py
      - src/benchmark1_dontcare_verify_candidate.py
      - src/benchmark1_best_verified_v7.py
      - tests/test_benchmark1_best_v7.py
      - .github/workflows/benchmark1-v7-repro.yml
  workflow_dispatch:
jobs:
  exact-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Pin verified native KickMix release
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Reachable table proof, exact complete math, native coherent quantum regression
        run: OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m pytest -q tests/test_benchmark1_best_v7.py
      - name: Rebuild byte-identical pinned v7 winner
        run: |
          mkdir -p out runs
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m src.benchmark1_best_verified_v7 --output out/best_verified_v7.kmb | tee runs/v7-rebuild.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-v7-pinned-coherent-rebuild
          path: |
            out/*.kmb
            runs/
