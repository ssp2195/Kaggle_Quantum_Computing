name: benchmark1-native-cost-admission
on:
  push:
    branches: [benchmark-1]
    paths:
      - 'src/benchmark1_cost_gate.py'
      - 'tests/test_benchmark1_cost_gate.py'
      - '.github/workflows/benchmark1-cost-gate.yml'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_benchmark1_cost_gate.py
      - run: python -m src.benchmark1_cost_gate --output runs/architecture_cost_gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark1-cost-gate
          path: runs/architecture_cost_gate.json
