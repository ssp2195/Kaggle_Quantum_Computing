name: benchmark1-v9-sha-pinned-original-first-row-repro
on:
  push:
    branches: [benchmark-1]
    paths:
      - src/benchmark1_first_row_specialization.py
      - src/benchmark1_firstrow_full_candidate.py
      - src/benchmark1_best_verified_v9.py
      - tests/test_benchmark1_best_v9.py
      - .github/workflows/benchmark1-v9-repro.yml
  workflow_dispatch:
jobs:
  native-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Pinned native KickMix at original verifier reference
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Complete normalized math, zero-accumulator algebra and quantum cleanup regressions
        run: OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m pytest -q tests/test_benchmark1_best_v9.py
      - name: Exact SHA-256 native circuit reconstruction and parameter proof
        run: |
          mkdir -p out runs
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m src.benchmark1_best_verified_v9 --output out/best_verified_v9.kmb | tee runs/v9-repro.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-v9-byte-identical-and-quantum-coherent
          path: |
            out/*.kmb
            runs/
