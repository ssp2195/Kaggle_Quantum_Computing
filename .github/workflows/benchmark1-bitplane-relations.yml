name: benchmark1-independent-exact-coefficient-bitplane-dependencies
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-bitplane-relations.yml']
jobs:
  algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy
      - name: Prove 384-row exact affine/AND relationships among coefficient bits
        run: |
          mkdir -p runs
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_boolean_bitplane_relations | tee runs/boolean-relations.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-coefficient-register-bit-relation-certificates
          path: runs/
