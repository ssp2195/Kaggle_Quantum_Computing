name: benchmark1-new-independent-single-residual-horner
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-direct-horner-refit.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Refitted integer normalized-domain and physical padding certificates
        run: |
          mkdir -p runs out mirror
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_direct_horner_refit --math-only | tee runs/horner_math.json
      - name: Native pinned kickmix
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Exact reversible Horner compile with coherence samples
        run: |
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_direct_horner_refit --verify-sample 256 | tee runs/horner_native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-compressed-horner-single-product
          path: |
            runs/
            out/*.kmb
