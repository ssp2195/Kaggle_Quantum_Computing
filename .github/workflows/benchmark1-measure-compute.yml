name: benchmark-1-measurement-in-computation
on:
  push:
    branches: [benchmark-1]
    paths:
      - 'src/benchmark1_measure_compute.py'
      - 'tests/test_benchmark1_measure_compute.py'
      - '.github/workflows/benchmark1-measure-compute.yml'
      - 'src/benchmark1_measure_streaming_cost.py'
      - 'tests/test_benchmark1_measure_streaming_cost.py'
  workflow_dispatch:
jobs:
  exact-instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - run: |
          git clone https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Check coherence, X measurements and conditional CZ corrections
        run: python -m pytest -q -s tests/test_benchmark1_measure_compute.py tests/test_benchmark1_measure_streaming_cost.py
      - name: Record real 2- and 3-bit native instrument cost
        run: python -m src.benchmark1_measure_compute --output runs/measurement_compute.json
      - name: Measure actual native single-term exponent-controlled phase gadget
        run: |
          mkdir -p runs
          python -m src.benchmark1_measure_streaming_cost --native --output runs/streamed_proxy.json
      - uses: actions/upload-artifact@v4
        with:
          name: measurement-during-phase-computation
          path: |
            runs/measurement_compute.json
            runs/streamed_proxy.json
