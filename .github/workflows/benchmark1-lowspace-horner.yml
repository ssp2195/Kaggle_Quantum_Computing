name: benchmark1-low-space-controlled-horner
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-lowspace-horner.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - run: OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_horner_low_space_controlled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-lowspace-direct-horner-native
          path: runs/horner_controlled_low_space.json
