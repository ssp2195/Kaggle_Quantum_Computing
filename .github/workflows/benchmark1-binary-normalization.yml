name: benchmark1-four-stage-binary-normalizer
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-binary-normalization.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: All 3 million normalization inputs
        run: |
          mkdir -p runs out
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_binary_block_normalizer --math-only | tee runs/binary_normalization_math.json
      - name: Install pinned native kickmix compiler
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Native binary-block normalization plus coherent sample
        run: |
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_binary_block_normalizer --output out/binary_block.kmb --verify-sample 256 | tee runs/binary_normalization_native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-benchmark1-binary-normalizer-native
          path: |
            runs/
            out/*.kmb
