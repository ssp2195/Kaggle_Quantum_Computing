name: benchmark1-original-coefficient-streaming-qubit-lifetimes
# Ensure 16 target wires at measured unlookup, avoiding KickMix clean-context underallocation
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-stream-coefficients.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Pinned Qualtran native KickMix compiler
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Compare 5 coefficient streaming lifetimes and Q x Toffoli floors
        run: |
          mkdir -p runs
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_stream_coefficients --variants split-anf-qrom split-qrom-qrom split-anf-anf --samples 256 | tee runs/streaming-native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-split-ROM-streaming-qubit-lifetimes
          path: runs/
