name: benchmark1-independent-shared-curvature-pairs
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-grouped-curvature.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Joint A/B integer-coefficient refit with C tied on adjacent intervals
        run: |
          mkdir -p runs out
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_grouped_curvature | tee runs/grouped_math.json
      - name: Pin native KickMix
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Native resource gate and coherent input samples
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_grouped_curvature --native | tee runs/grouped_native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-original-grouped-curvature-refit
          path: |
            runs/
            out/*.kmb
