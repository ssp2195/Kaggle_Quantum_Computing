name: benchmark1-original-measured-ANF-borrowed-output-ancilla
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-borrow-ANF-output.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Reconstruct exact pinned native KickMix
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Exact 384-row complement proof, native cost, 256x64 coherent trajectories
        run: |
          mkdir -p runs out
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_borrow_output_anf --samples 256 | tee runs/borrowed-ANF-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-AND-ancilla-borrowed-from-coefficient-register
          path: |
            runs/
            out/*.kmb
