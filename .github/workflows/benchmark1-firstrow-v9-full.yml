name: benchmark1-original-firstrow-v9-full-verified
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-firstrow-v9-full.yml']
jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Reconstruct exact pinned native KickMix
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Build exact and sample-verifiable zero-accumulator shortcut circuit
        run: |
          mkdir -p out runs mirror
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_firstrow_full_candidate --out out/firstrow_v9.kmb --sample 256 | tee runs/v9-native.json
      - name: Download and verify original untouched independent full verifier
        run: |
          curl -fLsS --retry 3 https://raw.githubusercontent.com/Inzainos/quantum-circuit-compilation/3dc0c58c5aa303ec8319433aded257aa757d14db/verifiers/invsqrt/verify_submission_invsqrt.py -o mirror/verify_submission_invsqrt.py
          python - <<'PY'
          import hashlib
          b=open('mirror/verify_submission_invsqrt.py','rb').read()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='1fa529e9790a5cb000ee7f084e197c9252e5f9d7'
          PY
      - name: Verify entire legal domain times 64 salted measurement outcomes
        run: |
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 python -I mirror/verify_submission_invsqrt.py out/firstrow_v9.kmb --n-p 10 --beta 1 --precision-bits 24 --eta 218 --max-x 3133452 --shots-per-x 64 --batch-size 256 --max-workers 4 --salt quantum-circuit-local-v1 > runs/full_score.json
          cat runs/full_score.json
      - name: Require exact coherent PASS and lower rotation-inclusive QxC
        run: |
          python - <<'PY'
          import json
          v=json.load(open('runs/full_score.json'))
          assert v['status']=='PASS',v
          assert v['verified_shots']==200540928,v
          assert v['num_qubits']==85 and v['toffoli_count']==2232 and v['rotation_count']==76,v
          assert v['score']<241424.49222389946,v
          print('FULLY VERIFIED ORIGINAL WINNER',v['score'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-carryfree-firstrow-v9-full-domain-verified
          path: |
            runs/
            out/*.kmb
