name: benchmark1-original-symmetric-row-compressed-square
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-symmetric-rows-v7.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Original exact 8192-input quadratic truncated-column certificate
        run: |
          mkdir -p out runs
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python - <<'PY'
          from src.benchmark1_symmetric_square_rows_v7 import exact_math_check
          r=exact_math_check();print(r);assert r['passes'],r
          PY
      - name: Pinned native KickMix compiler
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Native carry-safe row compressor and quantum coherence
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_symmetric_square_rows_v7 --samples 256 | tee runs/native-symmetric-rows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-original-symmetric-compressed-square
          path: |
            out/*.kmb
            runs/
