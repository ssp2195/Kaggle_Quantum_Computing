name: benchmark-1-centered-signed-Horner
on:
  push:
    branches: [benchmark-1]
    paths:
      - 'src/benchmark1_centered_horner.py'
      - 'src/benchmark1_centered_horner_cli.py'
      - 'tests/test_benchmark1_centered_horner.py'
      - '.github/workflows/benchmark1-centered-horner.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {segment: 6, guard: 4, lookup: qrom}
          - {segment: 6, guard: 4, lookup: xag}
          - {segment: 7, guard: 3, lookup: qrom}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          python -m pip install /tmp/Qualtran/kickmix
      - run: |
          python -m src.benchmark1_centered_horner_cli screen \
            --segment-bits ${{ matrix.segment }} --guard ${{ matrix.guard }} --lookup ${{ matrix.lookup }}
      - run: |
          mkdir -p out runs
          python -m src.benchmark1_centered_horner_cli build \
            --segment-bits ${{ matrix.segment }} --guard ${{ matrix.guard }} --lookup ${{ matrix.lookup }} \
            --output out/centered.kmb | tee runs/resources.json
      - run: |
          python -m src.benchmark1_centered_horner_cli verify \
            --circuit out/centered.kmb --random-count 8192 --output runs/sample.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: centered-${{ matrix.segment }}-${{ matrix.guard }}-${{ matrix.lookup }}
          path: |
            out/*.kmb
            runs/*.json
