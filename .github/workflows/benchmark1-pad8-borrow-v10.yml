name: benchmark1-original-pad8-CCZ-with-borrowed-ANF-output
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-pad8-borrow-v10.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Exhaustive mathematical 3.133M corrected phase-word difference proof
        run: |
          mkdir -p runs out
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_pad8_borrowed_v10 | tee runs/math.json
      - name: Exact verified native KickMix compiler pin
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Native 84-qubit candidate and 256x64 coherent trajectory screening
        run: |
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_pad8_borrowed_v10 --native --samples 256 | tee runs/native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-output-reuse-plus-CCZ-only-overflow-phase
          path: |
            runs/
            out/*.kmb
