name: benchmark1-original-conditional-overflow-phase-compression
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-phase-wrap-sweep.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Pinned independently verified native KickMix
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Native exact conditional overflow correction for pad 8/7/6
        run: |
          mkdir -p runs out
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_phase_conditioned_wrap --pads 8 7 6 --samples 256 | tee runs/wrap-native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-conditional-overflow-approximated-phase-ancillas
          path: |
            runs/
            out/*.kmb
