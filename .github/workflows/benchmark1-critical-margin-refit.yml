name: benchmark1-original-critical-phase-margin-minimax-refit
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-critical-margin-refit.yml']
jobs:
  mathematical:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy
      - name: Local exact integer minimax A/B/C refit and 3.145M normalized phase checks
        run: |
          mkdir -p runs
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_critical_interval_refit --span 35 | tee runs/minimax-refit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-exact-phase-margin-minimax-refit
          path: runs/
