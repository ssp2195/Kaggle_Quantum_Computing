name: benchmark1-original-dontcare-anf-full-verified
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-dontcare-full.yml']
jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Pin native KickMix compiler and exact source SHA
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Build unreachable-table-optimized exact reversible phase candidate
        run: |
          mkdir -p runs out mirror
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_dontcare_verify_candidate --output out/dontcare_anf_v7.kmb --sample 256 | tee runs/v7-native.json
      - name: Retrieve and hash-check untouched pinned public verifier
        run: |
          curl -fLsS --retry 3 https://raw.githubusercontent.com/Inzainos/quantum-circuit-compilation/3dc0c58c5aa303ec8319433aded257aa757d14db/verifiers/invsqrt/verify_submission_invsqrt.py -o mirror/verify_submission_invsqrt.py
          python - <<'PY'
          import hashlib
          b=open('mirror/verify_submission_invsqrt.py','rb').read()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest() == '1fa529e9790a5cb000ee7f084e197c9252e5f9d7'
          PY
      - name: Complete pinned 3,133,452 x 64 independent quantum verification
        run: |
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 python -I mirror/verify_submission_invsqrt.py out/dontcare_anf_v7.kmb --n-p 10 --beta 1 --precision-bits 24 --eta 218 --max-x 3133452 --shots-per-x 64 --batch-size 256 --max-workers 4 --salt quantum-circuit-local-v1 > runs/full_score.json
          cat runs/full_score.json
      - name: Strict complete PASS and actual Q x C improvement gate
        run: |
          python - <<'PY'
          import json
          s=json.load(open('runs/full_score.json'))
          assert s['status']=='PASS',s
          assert s['verified_shots']==200540928,s
          assert s['num_qubits']==86 and s['toffoli_count']==2418 and s['rotation_count']==76,s
          assert float(s['score'])<268172.78036771005,s
          print('INDEPENDENTLY VERIFIED IMPROVEMENT',s['score'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-dontcare-anf-full-verifier-PASS-artifact
          path: |
            runs/
            out/*.kmb
