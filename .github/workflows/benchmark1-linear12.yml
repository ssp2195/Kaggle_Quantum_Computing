name: benchmark1-original-piecewise-linear-p12
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-linear12.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: All 3145728 normalized mantissa input words
        run: |
          mkdir -p runs out
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_linear12 --math-only | tee runs/linear12_math.json
      - name: Install pinned native kickmix
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Native QROM-only floor before reversible multiplier
        run: |
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_linear12 --lookup-only --output out/linear12_lookup_only.kmb | tee runs/lookup_cost.json
      - name: Full original linear-phase oracle resources
        run: |
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_linear12 --output out/linear12.kmb --sample 128 | tee runs/full_cost.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-independent-p12-linear-native
          path: |
            runs/
            out/*.kmb
