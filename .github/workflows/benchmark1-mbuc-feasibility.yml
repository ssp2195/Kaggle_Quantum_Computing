name: benchmark-1-causal-MBUC-feasibility
on:
  push:
    branches: [benchmark-1]
    paths:
      - 'src/benchmark1_mbuc_feasibility.py'
      - 'tests/test_benchmark1_mbuc_feasibility.py'
      - '.github/workflows/benchmark1-mbuc-feasibility.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          python -m pip install /tmp/Qualtran/kickmix
      - run: python -m pytest -q tests/test_benchmark1_mbuc_feasibility.py
      - run: python -m src.benchmark1_mbuc_feasibility --output runs/mbuc_causal.json
      - uses: actions/upload-artifact@v4
        with:
          name: causal-mbuc-feasibility
          path: runs/mbuc_causal.json
