name: benchmark1-verified-best-v5-repro
on:
  push:
    branches: [benchmark-1]
    paths:
      - src/benchmark1_min_pad_proof.py
      - src/benchmark1_zero_residual_pad.py
      - src/benchmark1_best_verified_v5.py
      - tests/test_benchmark1_best_v5.py
      - .github/workflows/benchmark1-best-v5-repro.yml
  workflow_dispatch:
jobs:
  pinned-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Build pinned native compiler
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Exhaustive padding proof and native circuit fingerprint/coherence regression
        run: |
          mkdir -p out runs
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m pytest -q tests/test_benchmark1_best_v5.py
      - name: Pin verified KMB SHA-256 and operation statistics
        run: |
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m src.benchmark1_best_verified_v5 --output out/best_verified_v5.kmb | tee runs/v5_rebuild.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-v5-full-verified-source-rebuild
          path: |
            runs/
            out/*.kmb
