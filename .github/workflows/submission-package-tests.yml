name: submission-package-tests
on:
  push:
    branches: [benchmark1-direct-phase-experiments-20261108]
    paths:
      - 'scripts/package_submission.py'
      - 'tests/test_submission_package.py'
      - '.github/workflows/submission-package-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_submission_package.py
