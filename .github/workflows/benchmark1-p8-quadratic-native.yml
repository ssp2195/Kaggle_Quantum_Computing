name: benchmark1-original-768-interval-p8-quadratic
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-p8-quadratic-native.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Exact 3,145,728 phase-word and 3,133,452 bit-height screens
        run: |
          mkdir -p runs out
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_p8_quadratic | tee runs/p8-math.json
      - name: Pin native KickMix
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Native architecture Q*C lower bound and conditional coherent sample
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_p8_quadratic --native --sample 128 | tee runs/p8-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-independent-p8-native
          path: |
            runs/
            out/*.kmb
