name: benchmark1-original-p8-p9-precision-search
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-p8-p9-search.yml']
jobs:
  math:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy
      - name: New 768/1536-interval integer-cut accuracy landscape
        run: |
          mkdir -p runs
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_p8_precision_search | tee runs/p8-p9-result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-independent-p8-p9-int-accuracy
          path: runs/
