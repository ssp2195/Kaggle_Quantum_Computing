name: benchmark-1-truncated-full-verification
on:
  push:
    branches: [benchmark-1]
    paths: ['.github/workflows/benchmark1-full-verify.yml']
  workflow_dispatch:
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Build pinned native C++20 kickmix
        run: |
          git clone https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Pin and validate independent public competition verifier copy
        run: |
          mkdir -p mirror
          curl -fLsS --retry 3 \
             https://raw.githubusercontent.com/Inzainos/quantum-circuit-compilation/3dc0c58c5aa303ec8319433aded257aa757d14db/verifiers/invsqrt/verify_submission_invsqrt.py \
             -o mirror/verify_submission_invsqrt.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path("mirror/verify_submission_invsqrt.py").read_bytes()
          assert hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()=="1fa529e9790a5cb000ee7f084e197c9252e5f9d7"
          print("Pinned verifier blob checked")
          PY
      - name: Screen full mathematical domain and circuit-specific error certificate
        run: |
          mkdir -p runs out
          python -m pytest -q tests/test_priority1_model.py tests/test_priority1_truncated.py
          python -m src.priority1_cli screen --family chebyshev-tuned --degree 2 --segment-bits 6 --precision 25 \
            --output runs/full_math.json
      - name: Construct native kickmix candidate
        run: |
          python -m src.priority1_cli build --truncated --family chebyshev-tuned \
            --degree 2 --segment-bits 6 --precision 25 \
            --output out/truncated_tuned_6_25.kmb | tee runs/resources.json
      - name: Full independent 200540928-trajectory verification and resource score
        run: |
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 \
          python -I mirror/verify_submission_invsqrt.py out/truncated_tuned_6_25.kmb \
             --n-p 10 --beta 1 --precision-bits 24 --eta 218 \
             --max-x 3133452 --shots-per-x 64 --batch-size 256 \
             --max-workers 4 --salt quantum-circuit-local-v1 \
             > runs/verified_score.json
          cat runs/verified_score.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-truncated-tuned-6-25-full
          path: |
            runs/
            out/*.kmb
