name: benchmark-1-Horner-compact-MBUC
on:
  push:
    branches: [benchmark-1]
    paths:
      - 'src/benchmark1_horner.py'
      - 'tests/test_benchmark1_horner_compact.py'
      - '.github/workflows/benchmark1-horner-compact.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        guard: [3,4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          python -m pip install /tmp/Qualtran/kickmix
      - run: |
          mkdir -p out runs
          python -m src.benchmark1_horner_cli build --guard ${{ matrix.guard }} \
            --cleanup mbuc --normalization compact \
            --output out/horner_compact.kmb | tee runs/resources.json
      - run: |
          python -m src.benchmark1_horner_cli verify \
            --circuit out/horner_compact.kmb --random-count 8192 \
            --output runs/sample.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horner-compact-g${{ matrix.guard }}
          path: |
            out/*.kmb
            runs/*.json
