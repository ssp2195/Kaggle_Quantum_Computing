name: benchmark-1-measurement-streamed-phase-cost
on:
  push:
    branches: [benchmark-1]
    paths:
      - 'src/benchmark1_measure_streaming_cost.py'
      - 'tests/test_benchmark1_measure_streaming_cost.py'
      - '.github/workflows/benchmark1-measure-streaming-cost.yml'
  workflow_dispatch:
jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - run: |
          git clone https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Reproduce raw term counts and complete one-term native price
        run: |
          python -m pytest -q -s tests/test_benchmark1_measure_streaming_cost.py
          python -m src.benchmark1_measure_streaming_cost --native --output runs/streamed_proxy.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark1-streamed-measure-phase-proxy
          path: runs/streamed_proxy.json
