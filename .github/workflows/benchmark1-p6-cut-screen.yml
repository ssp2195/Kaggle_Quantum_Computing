name: benchmark1-independent-p6-exact-cuts
# Re-evaluate physically valid p6 native-cut combinations
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-p6-cut-screen.yml']
jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy
      - name: Exact partial column math for every legal 22-bit input
        run: |
          mkdir -p runs
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_p6_cut_screen | tee runs/p6-screen.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-p6-quadratic-precision-screen
          path: runs/
