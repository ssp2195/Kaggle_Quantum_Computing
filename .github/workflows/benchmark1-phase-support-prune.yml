name: benchmark1-original-full-domain-phase-support-sparsification
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-phase-support-prune.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Exact phase bit support proof across 3,133,452 legal inputs
        run: |
          mkdir -p out runs
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_phase_support_prune | tee runs/phase-support-math.json
      - name: Pin original KickMix native quantum compiler
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Native v9 resource cost and coherent quantum sample with removed zero-phase gates
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_phase_support_prune --native --samples 256 | tee runs/phase-support-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-exhaustive-phase-bit-support-rotation-prune
          path: |
            runs/
            out/*.kmb
