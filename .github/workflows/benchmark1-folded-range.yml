name: benchmark1-original-normalized-range-folding
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-folded-range.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: 4,194,304 exact folded mantissa phases and 3,133,452 no-wrap input check
        run: |
          mkdir -p out runs
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_folded_range | tee runs/folded-math.json
      - name: Native KickMix at original verified compiler commit
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Native 256-row folded oracle and sampled coherent phase
        run: |
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_folded_range --native --sample 256 | tee runs/folded-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independently-refitted-256-address-folded-oracle
          path: |
            runs/
            out/*.kmb
