name: benchmark1-original-192-interval-p6-quadratic
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-p6-quadratic-native.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Exhaustive normalized input polynomial plus exact shifted word height
        run: |
          mkdir -p runs out
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_p6_quadratic | tee runs/p6-math.json
      - name: Pinned native KickMix
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Coarse p6 oracle native gate cost, conditional coherence sample
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_p6_quadratic --native --sample 256 | tee runs/p6-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-p6-piecewise-quadratic-native
          path: |
            runs/
            out/*.kmb
