name: hybrid-native-candidates
on:
  push:
    branches: [benchmark1-direct-phase-experiments-20261108]
    paths:
      - 'src/hybrid_*.py'
      - 'tests/test_hybrid_*.py'
      - '.github/workflows/hybrid-native.yml'
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest pybind11==2.12.0
      - name: Build native C++20 kickmix from Qualtran
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          python -m pip install /tmp/Qualtran/kickmix
      - name: Full-domain numerical screens and native 22-bit tests
        run: |
          python -m pytest -q tests/test_hybrid_model.py tests/test_hybrid_kickmix.py
          python -m src.hybrid_cli screen --output runs/hybrid_numerical.json
      - name: Compile and measure three native 22-bit candidates
        run: |
          python -m src.hybrid_cli build --segment-bits 8 --precision 26 --output out/hybrid_8_26.kmb
          python -m src.hybrid_cli build --segment-bits 8 --precision 28 --output out/hybrid_8_28.kmb
          python -m src.hybrid_cli build --segment-bits 9 --precision 28 --output out/hybrid_9_28.kmb
      - name: Native trajectory samples with all 22 input bits
        run: |
          python -m src.hybrid_cli verify out/hybrid_8_26.kmb --random-count 2048 --output runs/hybrid_8_26_samples.json
          python -m src.hybrid_cli verify out/hybrid_8_28.kmb --random-count 2048 --output runs/hybrid_8_28_samples.json
          python -m src.hybrid_cli verify out/hybrid_9_28.kmb --random-count 2048 --output runs/hybrid_9_28_samples.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-native-reports
          path: runs/
