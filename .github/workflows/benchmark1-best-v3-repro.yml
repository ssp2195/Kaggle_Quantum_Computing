name: benchmark1-verified-best-v3-repro
on:
  push:
    branches: [benchmark-1]
    paths:
      - src/benchmark1_sparse_coeff.py
      - src/benchmark1_controlled_cut.py
      - src/benchmark1_single_joint_lookup.py
      - src/benchmark1_best_joint_v3.py
      - tests/test_benchmark1_best_v3.py
      - .github/workflows/benchmark1-best-v3-repro.yml
  workflow_dispatch:
jobs:
  exact-native-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - run: |
          git clone https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - run: OPENBLAS_NUM_THREADS=1 python -m pytest -q tests/test_benchmark1_best_v3.py tests/test_benchmark1_cost_gate.py
      - run: OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_best_joint_v3 --output out/best_joint_v3.kmb | tee verified_v3_rebuild.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-best-v3-hash-repro
          path: |
            verified_v3_rebuild.json
            out/*.kmb
