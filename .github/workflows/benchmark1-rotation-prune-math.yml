name: benchmark1-original-global-diagonal-phase-pruning
# Compare synthesis-error budget and rotation-inclusive QxC after exact gate pruning
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-rotation-prune-math.yml']
jobs:
  mathematical:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy
      - name: Exhaustive 3.133M exact native phase words and greedy gate deletion
        run: |
          mkdir -p runs
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_phase_rotation_prune_math | tee runs/phase-prune.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-independent-global-phase-rotation-pruning-proof
          path: runs/
