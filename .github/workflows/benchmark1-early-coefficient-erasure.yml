name: benchmark1-original-early-coefficient-uncomputation
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-early-coefficient-erasure.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Pin native compiler to full-verified v8
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Slope uncomputation before quadratic with measured and ANF variants
        run: |
          mkdir -p runs
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_early_coefficient_erasure | tee runs/native-early-erasure.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-early-slope-uncompute-qubit-optimization
          path: runs/
