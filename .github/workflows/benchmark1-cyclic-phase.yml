name: benchmark1-exact-cyclic-phase-padding-elimination
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-cyclic-phase.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Full A table x 11 shift exact overflow identity
        run: |
          mkdir -p runs out
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_cyclic_phase_correction | tee runs/cyclic_math.json
      - name: Install exact native KickMix release
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Native source cost and sampled coherence
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_cyclic_phase_correction --native --sample 256 | tee runs/cyclic_native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-phase-cyclic-overflow-compensation
          path: |
            runs/
            out/*.kmb
