name: benchmark-1-phase-stage-cost-profile
on:
  push:
    branches: [benchmark-1]
    paths:
      - 'src/benchmark1_profile.py'
      - 'src/benchmark1_symmetric_square.py'
      - '.github/workflows/benchmark1-profile.yml'
  workflow_dispatch:
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pybind11==2.12.0
      - run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          python -m pip install /tmp/Qualtran/kickmix
      - run: python -m src.benchmark1_profile --output runs/stage_costs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-stage-profile
          path: runs/stage_costs.json
