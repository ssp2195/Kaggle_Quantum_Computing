name: benchmark1-original-operand-orientation-v9
# True 17x13 and 13x7 operand-swap test; previous shape guards were inert
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-product-orientation-v9.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest pybind11==2.12.0
      - name: Pinned native KickMix at reproducible verified build
        run: |
          git clone --depth 1 https://github.com/quantumlib/Qualtran.git /tmp/Qualtran
          git -C /tmp/Qualtran fetch --depth 1 origin 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          git -C /tmp/Qualtran checkout 9a0c11a4ee7697c082fbf8f2e1e8bf4a71fcb453
          python -m pip install /tmp/Qualtran/kickmix
      - name: Compile and coherently test all four exact truncated product orientations
        run: |
          mkdir -p runs
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_product_orientation_v9 | tee runs/product-orientation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-v9-arithmetic-operand-swap-study
          path: runs/
