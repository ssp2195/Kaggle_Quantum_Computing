name: benchmark1-original-slope-curvature-coefficient-bit-compression
on:
  push:
    branches: [bench1-architecture-redesign-20261127]
    paths: ['.github/workflows/benchmark1-slope-curvature-refit.yml']
jobs:
  mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy
      - name: Original exact omitted-column low-bit quantized slope curvature co-refit
        run: |
          mkdir -p runs
          set -o pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m src.benchmark1_slope_curvature_refit --max 6 | tee runs/coefficient-math.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark1-independent-compressed-coefficient-arithmetic
          path: runs/
